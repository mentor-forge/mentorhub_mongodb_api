_locked: false
file_name: Notification.0.1.0.yaml
root:
  additional_properties: false
  description: Cross-domain notification for Discovery presentation and dismiss.
  name: Notification
  properties:
  - description: The unique identifier for the Notification.
    name: _id
    required: false
    type: identifier
  - description: Searchable / display title for the notification
    name: name
    required: false
    type: word
  - description: User-facing notification body text
    name: message
    required: false
    type: sentence
  - description: Scope target — exactly one of profile_id, customer_id, mentor_id, or global breadcrumb
    name: scope_id
    properties:
    - additional_properties: false
      description: Profile-scoped notification target
      name: profile_id
      properties:
      - description: Target Profile _id
        name: profile_id
        required: true
        type: identifier
      required: false
      type: object
    - additional_properties: false
      description: Customer-scoped notification target
      name: customer_id
      properties:
      - description: Target Customer _id
        name: customer_id
        required: true
        type: identifier
      required: false
      type: object
    - additional_properties: false
      description: Mentor-scoped notification target
      name: mentor_id
      properties:
      - description: Target Mentor Profile _id
        name: mentor_id
        required: true
        type: identifier
      required: false
      type: object
    - additional_properties: false
      description: Globally scoped notification
      name: global
      properties:
      - description: Global scope breadcrumb (when the notification was published globally)
        name: global
        required: true
        type: breadcrumb
      required: false
      type: object
    required: false
    type: one_of
  - additional_properties: true
    description: Optional cross-SPA route metadata (F-US09); additional properties allowed
    name: link_metadata
    properties: []
    required: false
    type: object
  - description: Breadcrumb set when the user dismisses the notification
    name: dismissed
    required: false
    type: breadcrumb
  - description: Breadcrumb set when the notification is cancelled or superseded
    name: cancelled
    required: false
    type: breadcrumb
  - description: The tracking breadcrumb for when the Notification was created.
    name: created
    required: false
    type: breadcrumb
  - description: Soft-delete status (active / archived); distinct from dismissed / cancelled
    enums: default_status
    name: status
    required: false
    type: enum
  required: false
  type: object
